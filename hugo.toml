baseURL = 'https://ruppec.github.io/'
languageCode = 'en-us'
title = 'Charlie Ruppe'
copyright = '© 2026 Charles Ruppe.'


[params]
  inlineCSS = true
  description = "A page of my personal website"

[caches]
  [caches.images]
    dir = ':cacheDir/images'

sectionPagesMenu = "main"

[markup.highlight]
    noClasses = true  # This is the crucial change
    lineNos = false    # Set to true if you want numbers
    style = "github"

[markup.goldmark.parser]
    autoHeadingID = true
    wrapStandAloneImageWithinParagraph = false

[markup.tableOfContents]
    startLevel = 2
    ordered = false
    endLevel = 3

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
        unsafe = true
    [markup.goldmark.extensions]
        [markup.goldmark.extensions.passthrough]
            enable = true
        [markup.goldmark.extensions.passthrough.delimiters]
            block = [['\\[', '\\]'], ['$$', '$$']]
            inline = [['\\(', '\\)'], ['$', '$']]


# prevent hugo from seeing the .org files
[module]
  [[module.mounts]]
    source = "content"
    target = "content"
    excludeFiles = ["**.org"]