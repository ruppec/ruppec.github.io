<a href="/">
  {{ $img := resources.Get "images/face.jpeg" }}
  {{ $lowRes := $img.Resize "150x webp" }} 
  <img id="logo"
       src="{{ $lowRes.RelPermalink }}"
       width="{{ $lowRes.Width }}"
       height="{{ $lowRes.Height }}"
       alt="A picture of my face"
       fetchpriority="high"
       loading="eager">
</a>

<div id="heading-and-nav">
<h1>
  <a href="/">{{ .Site.Title }}</a>
</h1>
<div id="horizontal-nav">
  {{ partial "nav.html" . }}
</div>
</div>
<div id="vertical-nav">
  <details>
    <summary>
     {{ partial "icons" "menu-outline" }} 
    </summary>
    {{ partial "nav.html" .}}
  </details>
</div>
